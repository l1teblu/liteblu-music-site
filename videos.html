<!DOCTYPE html>
<html>
    <head>
        <title>My Videos</title>
        <link rel="icon" href="assets/favicon.png">
        <link rel="stylesheet" href="css/styles.css">
        <script src="js/main.js" defer></script>
    </head>

    <body>
        <div class="preload-images">
            <img src="assets/home-button-hover.png" alt="">
            <img src="assets/music-button-hover.png" alt="">
            <img src="assets/video-button-hover.png" alt="">
            <img src="assets/contact-button-hover.png" alt="">
            <img src="assets/support-button-hover.png" alt="">
        </div>
        <div class="logo-area">
            <img src="assets/logo.png" alt="Liteblu logo" class="logo">
        </div>
        <div class="navigation-buttons">
            <a href="https://liteblumusic.com" class="image-button home-button" aria-label="Home"></a>
            <a href="music" class="image-button music-button" aria-label="Music"></a>
            <a href="videos" class="image-button video-button" aria-label="Videos"></a>
            <a href="contact" class="image-button contact-button" aria-label="Contact"></a>
            <a href="support" class="image-button support-button" aria-label="Support"></a>
        </div>
        <div class="body-frame">
            <div class="body-text">
                <p>
                    I create YouTube videos for fun and to practice my video editing.
                    Here's my latest video!
                </p>
                <div class="video-embed">
                    <iframe
                        src="https://youtube.com/embed/CTamnEBfY-A"
                        title="Latest Liteblu video"
                        loading="lazy"
                        allowfullscreen>
                    </iframe>
                </div>
                <div>
                <p>
                    Feel free to check out my videos at my channel.
                </p>
                <p class="stats">
                    Current subscribers: <span id="subscriber-count">Loading...</span>
                </p> 
                </div>
                <div class="youtube-channel-banner-button">
                    <a href="https://youtube.com/@l1teblu" >
                        <img 
                            src="assets/youtube-button.png"
                            alt="Visit my Youtube Channel!">
                    </a>
                </div>
            </div>
        </div>
    </body>
</html>
